name: Build Github pages

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

permissions:
    contents: write

jobs:
  builddocs:
    name: Build Documenation files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Merge Old docs
      run: |
        git config --global user.email "null@null"
        git config --global user.name "GH Page builder"
        git fetch origin  +refs/heads/gh-pages:refs/remotes/origin/gh-pages
        git  merge -s ours origin/gh-pages
        git checkout -b gh-pages
    - name: Install docutils
      run: |
            python -m pip install --upgrade pip
            pip install docutils
    - name: Build and commit new HTML
      run: |
            cd $GITHUB_WORKSPACE/docs
            for file in *.rst; do rst2html $file >  ${file%%rst}html; done
            git add .
            git diff --cached --quiet || git commit -m 'Rebuild HTML for gh-pages'
    # Pull requests only check the docs build; they mustn't publish.
    - name: Push back to GH
      if: github.event_name == 'push'
      run: |
            git push --verbose origin gh-pages:gh-pages
