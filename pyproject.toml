[project]
name = "MysteryMachine"
description = ""
version = "0.4.0"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
  {name = "Roger Gammans", email = "rgammans@gammascience.co.uk"},
]

# Supported: every CPython release which hasn't reached end of life.
# Keep in step with tox.ini and .github/workflows/pythonapp.yml.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "docutils",
    "pyparsing>1.5",
    "PyYaml",
    "six"
]

[tool.setuptools]
#py_modules=[]
packages = [
    "MysteryMachine",
    "MysteryMachine.schema",
    "MysteryMachine.store",
    "MysteryMachine.parsetools",
    "MysteryMachine.Ui",
    "MysteryMachine.utils",
    "MysteryMachine.policies",
    "MysteryMachine.document"
]

[project.scripts]
mysterymachine = "MysteryMachine.Main:main"
mmcli   = "MysteryMachine.Ui.cli:main"
#Disabled (not wokring) gui script.
# "mmwx          = MysteryMachine.Ui.wx:main"
[project.optional-dependencies]
git = [
    "gitpython"
]
hg = [
    "python-hglib"
]


[build-system]
requires = ["setuptools", "wheel" ]
build-backend = "setuptools.build_meta"
