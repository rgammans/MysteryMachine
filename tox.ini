[tox]
# Supported: every CPython release which hasn't reached end of life.
# Keep in step with pyproject.toml and .github/workflows/pythonapp.yml.
envlist = py311, py312, py313, py314, py315
skipsdist=True
skip_missing_interpreters=True

[testenv]
passenv = *
deps =
    -rrequirements.txt
    mercurial
commands = python -m unittest discover -p '{posargs:*.py}' -s tests
